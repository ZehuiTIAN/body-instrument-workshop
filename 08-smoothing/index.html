<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>08 · Smoothing</title>
  <link rel="stylesheet" href="../shared/style.css" />
</head>
<body>
  <div class="stage">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="panel">
    <h1>08 · SMOOTHING — AI 的输出在抖，怎么办</h1>
    <button id="startButton">▶ Start Audio</button>

    <label class="control">
      <input type="checkbox" id="smoothingToggle" checked />
      开启 smoothing
    </label>
    <label class="control">
      alpha: <span id="alphaValue">0.15</span>
      <input type="range" id="alphaSlider" min="0.02" max="1" step="0.01" value="0.15" />
    </label>

    <div class="big-readout">
      <span class="sub">raw:</span> <span id="rawValue">——</span><br />
      <span class="sub">smooth:</span> <span id="smoothValue">——</span>
    </div>
    <div class="status" id="status">正在启动…</div>
    <div class="debug" id="debug"></div>
  </div>

  <script src="../shared/vendor/Tone.js"></script>
  <script src="../shared/camera.js"></script>
  <script src="../shared/debug.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
